services:
  grott:
    image: ledidobe/grott:2.8.3
    networks:
      - net
    restart: always
    ports:
      - "5279:5279"
    environment:
      - gmqttip=10.0.10.10
      - ginvtype=sph
      - ggrowattip=47.254.130.145

  mqtt:
    image: eclipse-mosquitto:2
    restart: always
    networks:
      net:
         ipv4_address: 10.0.10.10
    ports:
      - "37000:1883"
      - "37001:9001"
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log

  surreal:
    image: surrealdb/surrealdb:v2
    command: start rocksdb:/data/store.db
    restart: always
    ports:
      - "37002:8000"
    volumes:
      - ./db:/data

networks:
  net:
    ipam:
      driver: default
      config:
        - subnet: 10.0.10.0/24
